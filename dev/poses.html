<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"../assets/vendor/three/three.module.min.js"}}</script>
<style>body{margin:0;background:#222}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { createCharacter, applyPose } from '../assets/js/character.js';
import { POSES } from '../assets/js/poses.js';
const params=new URLSearchParams(location.search);
const names=(params.get('poses')||Object.keys(POSES).join(',')).split(',');
const angle=parseFloat(params.get('a')||'0');
const W=260,H=460;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W*names.length,H*2);document.body.appendChild(r.domElement);
r.setScissorTest(true);
names.forEach((n,i)=>{[0,1].forEach(row=>{
 const scene=new THREE.Scene();scene.background=new THREE.Color(0xe8e6e1);
 scene.add(new THREE.HemisphereLight(0xffffff,0x444455,1.6));
 const d=new THREE.DirectionalLight(0xffffff,2);d.position.set(2,3,4);scene.add(d);
 const rig=createCharacter();applyPose(rig,POSES[n]);scene.add(rig.root);
 rig.root.rotation.y = row===0? angle : 0.9;
 const cam=new THREE.PerspectiveCamera(30,W/H,0.1,50);cam.position.set(0,1.05,4.3);cam.lookAt(0,0.95,0);
 r.setViewport(i*W,(1-row)*H,W,H);r.setScissor(i*W,(1-row)*H,W,H);r.render(scene,cam);
});});
document.title='done';
</script></body></html>
